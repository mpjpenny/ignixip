name: Build indexable pages

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/build_pages.py"
      - "embed.js"
      - "site.css"
      - ".github/workflows/build-pages.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate pages
        run: python3 scripts/build_pages.py ${{ github.event_name == 'schedule' && '--refresh' || '' }}
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No page changes"
          else
            git commit -m "Refresh indexable pages"
            git push
          fi
