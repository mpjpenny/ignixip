<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>ignixip</title>
    <script>
        (function () {
            var path = location.pathname;
            if (/^\/(ip|dns|whois|bl|blacklist|asn|tools)\/([^/]+)\/?$/i.test(path)) {
                location.replace('/?path=' + encodeURIComponent(path));
            }
        })();
    </script>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0a0f1a; color: #e2e8f0; font-family: Inter, sans-serif; }
        a { color: #60a5fa; }
    </style>
</head>
<body>
    <p>That page is not on ignixip. <a href="/">Look up an address</a>.</p>
</body>
</html>
